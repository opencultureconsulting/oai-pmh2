name: Psalm Static Analyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  Psalm:
    name: Psalm Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer

      - name: Install Dependencies
        run: composer update --no-interaction --no-progress

      - name: Run Psalm
        run: vendor/bin/psalm --config=psalm.xml.dist --taint-analysis --report=psalm-results.sarif --no-progress

      - name: Upload Analysis Results
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: psalm-results.sarif
          wait-for-processing: true
