version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # Stay on Symfony 7.4, because it's a long-term support (LTS) version.
      - dependency-name: "symfony/*"
        versions: [ ">=7.5" ]
    assignees:
      - "sebastian-meyer"
    labels: [ ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "sebastian-meyer"
    labels: [ ]
